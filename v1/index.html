<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>GMS · מוקאפ</title>
<style>
:root{--g:#1e7a46;--ink:#18231d;--muted:#5b675f;--line:#dde3d8}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5ef;font-family:"Segoe UI",Arial,sans-serif;color:var(--ink);padding:16px}
form{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px 28px;box-shadow:0 18px 50px rgba(24,35,29,.10);display:grid;gap:14px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:22px}
h1{margin:0;font-size:22px}
p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
label{font-size:14px;font-weight:600}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid #cbd4c7;border-radius:10px;direction:ltr;text-align:left}
input:focus-visible,button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
button{font:inherit;font-size:16px;font-weight:600;background:var(--g);color:#fff;border:0;border-radius:10px;padding:11px;cursor:pointer}
button[disabled]{opacity:.6}
.err{color:#b23a3a;font-size:14px;min-height:20px}
.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);font-weight:400}
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <div class="logo">M</div>
  <h1>מוקאפ GMS</h1>
  <p>הגישה מוגבלת. הזינו את הסיסמה שקיבלתם.</p>
  <label for="pw">סיסמה</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> לזכור אותי בדפדפן הזה</label>
  <button id="go" type="submit">כניסה</button>
  <div class="err" id="err" role="alert"></div>
</form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const K='gms_mock_pw';
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault(); const pw=document.getElementById('pw').value, b=document.getElementById('go'), er=document.getElementById('err');
  b.disabled=true; b.textContent='פותח…'; er.textContent='';
  try{const h=await open_(pw); try{document.getElementById('rem').checked?localStorage.setItem(K,pw):localStorage.removeItem(K);}catch(_){} show(h);}
  catch(_){er.textContent='הסיסמה שגויה. נסו שוב.'; b.disabled=false; b.textContent='כניסה';}
});
(async()=>{let s=null;try{s=localStorage.getItem(K);}catch(_){} if(s){try{show(await open_(s));}catch(_){try{localStorage.removeItem(K);}catch(__){}}}})();
</script>
